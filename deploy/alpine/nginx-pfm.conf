# nginx: www.miosito.it/pfm  ->  PFM su 192.168.10.10:9999
# Va dentro il blocco  server { listen 443 ssl; server_name www.miosito.it; ... }
#
# PFM non conosce il prefisso /pfm (usa URL assoluti: /api, /app.js, /sw.js...),
# quindi nginx toglie il prefisso verso il backend e riscrive quei pochi URL
# nelle risposte (sub_filter). Se cambia il frontend, riverifica le regole.
# Alternativa a prova di aggiornamenti: un sotto-dominio (pfm.miosito.it) con
# un semplice proxy_pass, senza nessuna riscrittura.

location = /pfm { return 301 /pfm/; }

# Service worker: qui OGNI stringa '/...' e' un percorso da prefissare.
location = /pfm/sw.js {
    proxy_pass http://192.168.10.10:9999/sw.js;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # $remote_addr (e NON $proxy_add_x_forwarded_for): l'indirizzo reale del
    # client viene scritto da nginx, mai concatenato a un header del client.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding   "";   # sub_filter non lavora su risposte compresse

    sub_filter_once off;
    sub_filter_types application/javascript text/javascript;
    sub_filter "'/" "'/pfm/";
}

location ^~ /pfm/ {   # ^~ : vince su eventuali location regex (es. cache asset .js/.css)
    proxy_pass http://192.168.10.10:9999/;   # lo slash finale toglie il prefisso /pfm
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding   "";

    client_max_body_size 20m;                # import CSV

    # Cookie di sessione/CSRF (Path=/) limitati a /pfm/, non a tutto il sito
    proxy_cookie_path / /pfm/;
    # Redirect relativi del backend (solo in modalita' setup)
    proxy_redirect / /pfm/;

    sub_filter_once off;
    sub_filter_types application/javascript text/javascript application/manifest+json;
    sub_filter '="/'                  '="/pfm/';            # HTML: href/src
    sub_filter '"/icons/'             '"/pfm/icons/';       # manifest.webmanifest
    sub_filter "'/api"                "'/pfm/api";          # app.js, offline-queue.js, setup_*.js
    sub_filter '`/api'                '`/pfm/api';          # offline-queue.js
    sub_filter '`/i18n/'              '`/pfm/i18n/';        # app.js
    sub_filter "'/sw.js'"             "'/pfm/sw.js'";       # registrazione service worker
    sub_filter "'/setup_wizard.html'" "'/pfm/setup_wizard.html'";
}
