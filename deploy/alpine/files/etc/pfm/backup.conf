# Configurazione backup PFM Database
# File di configurazione sourceable (sh) per pfm-backup

# Remote rclone da utilizzare (formato: remote:percorso)
# Il remote deve essere configurato in RCLONE_CONFIG_FILE
RCLONE_REMOTE="gdrive:pfm-backups"

# Numero di backup locali da mantenere
# I file più vecchi vengono eliminati
KEEP_LOCAL=14

# Numero di giorni per mantenere i backup remoti
# I file remoti più vecchi di questo numero di giorni verranno eliminati
# Impostare a 0 per non eliminare mai i file remoti
KEEP_REMOTE_DAYS=60

# Percorso al file di configurazione rclone
RCLONE_CONFIG_FILE="/etc/pfm/rclone.conf"

# Abilita il caricamento remoto via rclone (yes/no)
# Se disabilitato, il backup viene eseguito solo localmente
RCLONE_ENABLED="yes"
